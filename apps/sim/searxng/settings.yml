# Minimal SearXNG settings for local WorldSim use (JSON API enabled).
use_default_settings: true

general:
  instance_name: "worldsim-searxng"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "zh-CN"
  formats:
    - html
    - json

server:
  secret_key: "worldsim-local-dev-change-me"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true
