<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WorldSim 观测</title>
  <style>
    :root {
      --bg: #1a1f24;
      --fg: #e8ecef;
      --muted: #8b969e;
      --accent: #3d8bfd;
      --panel: #242b33;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Noto Sans SC", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #2a3540, var(--bg));
      color: var(--fg);
      min-height: 100vh;
      padding: 1.5rem;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.25rem; }
    p.sub { color: var(--muted); margin: 0 0 1rem; font-size: 0.9rem; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; align-items: center; }
    input, button {
      font: inherit;
      border-radius: 6px;
      border: 1px solid #3a4550;
      background: var(--panel);
      color: var(--fg);
      padding: 0.45rem 0.7rem;
    }
    button { background: var(--accent); border-color: transparent; cursor: pointer; }
    button.secondary { background: #3a4550; }
    pre {
      background: var(--panel);
      padding: 1rem;
      border-radius: 8px;
      overflow: auto;
      font-size: 0.8rem;
      line-height: 1.4;
      max-height: 70vh;
    }
    .err { color: #f07178; }
  </style>
</head>
<body>
  <h1>WorldSim 只读观测</h1>
  <p class="sub">记忆 / PAD 仅查看；推进走 debug tick（非用户写库）。</p>
  <div class="row">
    <label>API <input id="base" size="28" value="http://127.0.0.1:8100" /></label>
    <label>agent_id <input id="agent" size="18" value="agent_seed_01" /></label>
    <button id="btnSnap">刷新快照</button>
    <button id="btnMem" class="secondary">记忆</button>
    <button id="btnPad" class="secondary">PAD</button>
    <button id="btnTick">Tick ×1</button>
    <button id="btnTickN" class="secondary">Tick ×8</button>
  </div>
  <pre id="out">加载中…</pre>
  <script>
    const out = document.getElementById("out");
    const base = () => document.getElementById("base").value.replace(/\/$/, "");
    const agent = () => document.getElementById("agent").value.trim();
    async function go(path, opts) {
      out.textContent = "…";
      try {
        const r = await fetch(base() + path, opts);
        const t = await r.text();
        let j;
        try { j = JSON.parse(t); } catch { throw new Error(t || r.statusText); }
        if (!r.ok) throw new Error(JSON.stringify(j, null, 2));
        out.textContent = JSON.stringify(j, null, 2);
      } catch (e) {
        out.innerHTML = '<span class="err">' + e.message + "</span>";
      }
    }
    document.getElementById("btnSnap").onclick = () =>
      go("/world/snapshot?agent_id=" + encodeURIComponent(agent()));
    document.getElementById("btnMem").onclick = () =>
      go("/memories?agent_id=" + encodeURIComponent(agent()) + "&limit=20");
    document.getElementById("btnPad").onclick = () =>
      go("/affect/trajectory?agent_id=" + encodeURIComponent(agent()) + "&limit=20");
    document.getElementById("btnTick").onclick = () =>
      go("/debug/tick?agent_id=" + encodeURIComponent(agent()) + "&n=1", { method: "POST" });
    document.getElementById("btnTickN").onclick = () =>
      go("/debug/tick?agent_id=" + encodeURIComponent(agent()) + "&n=8", { method: "POST" });
    document.getElementById("btnSnap").click();
  </script>
</body>
</html>
